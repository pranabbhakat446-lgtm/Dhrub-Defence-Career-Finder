<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .box{

            width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;

        }

        h2{

            text-align:center;
            color:#002b5b;

        }

        input{

            width:100%;
            padding:12px;
            margin:12px 0;
            box-sizing:border-box;

        }

        button{

            width:100%;
            padding:12px;
            background:#002b5b;
            color:white;
            border:none;
            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<form action="/forgot-password" method="POST">

<input
type="email"
name="email"
placeholder="Enter Registered Email"
required>

<input
type="password"
name="password"
placeholder="Enter New Password"
required>

<button>

Update Password

</button>

</form>

</div>

</body>

</html>
