<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dhrub Defence Career Finder | Login</title>

    <meta name="description"
          content="Login to Dhrub Defence Career Finder to explore Indian Army, Navy, Air Force, CAPF jobs, latest defence vacancies and eligibility information.">

    <meta name="keywords"
          content="Dhrub Defence Career Finder, Dhrub, defence jobs, Indian Army jobs, Indian Navy jobs, Indian Air Force jobs, CAPF jobs, defence vacancy">

    <meta name="robots" content="index, follow">

    <meta name="author" content="Dhrub Defence Career Finder">

    <link rel="canonical"
          href="https://dhrub-defence-career-finder.vercel.app/login">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 12, 35, 0.76),
                    rgba(0, 25, 65, 0.88)
                ),
                url("/static/images/bglogin.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            position: relative;

            overflow: hidden;
        }


        /* =========================
           BACKGROUND EFFECTS
        ========================= */

        body::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 215, 0, 0.20),
                    transparent 68%
                );

            top: -230px;
            left: -180px;

            animation: glowMove 7s ease-in-out infinite alternate;
        }


        body::after {

            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 140, 255, 0.20),
                    transparent 68%
                );

            bottom: -220px;
            right: -150px;

            animation: glowMove2 8s ease-in-out infinite alternate;
        }


        @keyframes glowMove {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(70px, 50px);
            }
        }


        @keyframes glowMove2 {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-60px, -50px);
            }
        }


        /* Floating circles */

        .circle {

            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.12);

            animation: floatCircle 10s linear infinite;
        }


        .circle.one {

            width: 110px;
            height: 110px;

            top: 12%;
            left: 8%;
        }


        .circle.two {

            width: 170px;
            height: 170px;

            bottom: 10%;
            left: 4%;

            animation-delay: 2s;
        }


        .circle.three {

            width: 90px;
            height: 90px;

            top: 8%;
            right: 10%;

            animation-delay: 4s;
        }


        .circle.four {

            width: 140px;
            height: 140px;

            bottom: 12%;
            right: 6%;

            animation-delay: 1s;
        }


        @keyframes floatCircle {

            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(180deg);
            }

            100% {
                transform: translateY(0) rotate(360deg);
            }
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-box {

            position: relative;

            z-index: 10;

            width: 440px;
            max-width: 100%;

            padding: 42px 40px 35px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.98),
                    rgba(245,249,255,0.96)
                );

            border-radius: 26px;

            text-align: center;

            border: 1px solid rgba(255,255,255,0.8);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                0 0 50px rgba(0,110,255,0.10);

            backdrop-filter: blur(18px);

            animation: loginAppear 0.8s ease;

        }


        @keyframes loginAppear {

            from {

                opacity: 0;

                transform:
                    translateY(45px)
                    scale(0.92);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* Gold top line */

        .login-box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 130px;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #d69e00,
                    #ffd700,
                    #d69e00
                );

            border-radius: 0 0 10px 10px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-icon {

            width: 82px;
            height: 82px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #001d3d,
                    #004b8d,
                    #006fc9
                );

            display: flex;

            justify-content: center;
            align-items: center;

            color: white;

            font-size: 38px;

            border: 4px solid rgba(255,215,0,0.85);

            box-shadow:
                0 0 0 5px rgba(0,43,91,0.08),
                0 12px 30px rgba(0,43,91,0.35);

            animation: logoPulse 3s ease-in-out infinite;
        }


        @keyframes logoPulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }


        .brand-name {

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2.5px;

            color: #c18b00;

            margin-bottom: 9px;

            text-transform: uppercase;
        }


        /* =========================
           TITLE
        ========================= */

        .login-box h1 {

            color: #002b5b;

            font-size: 29px;

            font-weight: 850;

            margin-bottom: 9px;

            line-height: 1.2;
        }


        .subtitle {

            color: #687384;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 27px;
        }


        /* Security badge */

        .portal-badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 7px 13px;

            margin-bottom: 23px;

            border-radius: 30px;

            background: #eef6ff;

            border: 1px solid #d7e9fb;

            color: #0057a8;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        /* =========================
           INPUTS
        ========================= */

        .input-group {

            text-align: left;

            margin-bottom: 18px;
        }


        .input-group label {

            display: block;

            color: #002b5b;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            color: #0057a8;

            z-index: 2;
        }


        .login-box input {

            width: 100%;

            padding: 14px 16px 14px 45px;

            border: 1px solid #d6dfe9;

            border-radius: 13px;

            outline: none;

            font-size: 14px;

            color: #1d2a38;

            background: #f8fbff;

            transition: all 0.3s ease;
        }


        .login-box input::placeholder {

            color: #9aa6b4;
        }


        .login-box input:hover {

            border-color: #9eb8d4;
        }


        .login-box input:focus {

            border-color: #006dcc;

            background: white;

            box-shadow:
                0 0 0 4px rgba(0,109,204,0.10),
                0 5px 15px rgba(0,60,120,0.06);
        }


        /* Password input */

        .password-wrapper input {

            padding-right: 78px;
        }


        .toggle-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            padding: 6px 9px;

            border: none;

            background: transparent;

            color: #0057a8;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            border-radius: 7px;
        }


        .toggle-password:hover {

            background: #eaf4ff;

            color: #c18b00;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            position: relative;

            overflow: hidden;

            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #001f45,
                    #004b8d,
                    #006fc9
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            letter-spacing: 0.3px;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 10px 25px rgba(0,43,91,0.30);
        }


        .login-button::before {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.30),
                    transparent
                );

            transform: skewX(-20deg);

            transition: 0.7s;
        }


        .login-button:hover::before {

            left: 140%;
        }


        .login-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 16px 32px rgba(0,43,91,0.38);
        }


        .login-button:active {

            transform: translateY(0);
        }


        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot {

            margin-top: 17px;
        }


        .forgot a {

            text-decoration: none;

            color: #0057a8;

            font-size: 13px;

            font-weight: 700;

            transition: 0.2s;
        }


        .forgot a:hover {

            color: #c18b00;
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 11px;

            margin: 22px 0;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d7dce2
                );
        }


        .divider::after {

            background:
                linear-gradient(
                    90deg,
                    #d7dce2,
                    transparent
                );
        }


        .divider span {

            color: #9aa1aa;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }


        /* =========================
           SIGNUP
        ========================= */

        .signup-text {

            color: #697583;

            font-size: 13px;
        }


        .signup-text a {

            color: #002b5b;

            text-decoration: none;

            font-weight: 800;

            transition: 0.2s;
        }


        .signup-text a:hover {

            color: #c18b00;
        }


        /* =========================
           SECURITY
        ========================= */

        .security-text {

            margin-top: 22px;

            padding-top: 15px;

            border-top: 1px solid #e8edf2;

            font-size: 11px;

            color: #8b96a3;
        }


        /* =========================
           FOOTER TEXT
        ========================= */

        .footer-text {

            margin-top: 13px;

            font-size: 9px;

            color: #a5adb7;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .login-box {

                padding: 36px 23px 28px;

                border-radius: 22px;
            }


            .login-box h1 {

                font-size: 24px;
            }


            .subtitle {

                font-size: 13px;
            }


            .logo-icon {

                width: 70px;
                height: 70px;

                font-size: 31px;
            }


            .circle {

                display: none;
            }
        }


        @media (max-height: 700px) {

            .login-box {

                padding-top: 27px;
                padding-bottom: 24px;
            }


            .logo-icon {

                width: 65px;
                height: 65px;

                font-size: 29px;
            }


            .portal-badge {

                margin-bottom: 15px;
            }


            .subtitle {

                margin-bottom: 18px;
            }
        }

    </style>


    <!-- =========================
         STRUCTURED DATA
    ========================= -->

    <script type="application/ld+json">

    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Dhrub Defence Career Finder",
        "alternateName": "Dhrub",
        "url": "https://dhrub-defence-career-finder.vercel.app/"
    }

    </script>


    <script type="application/ld+json">

    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dhrub Defence Career Finder",
        "alternateName": "Dhrub",
        "url": "https://dhrub-defence-career-finder.vercel.app/"
    }

    </script>

</head>


<body>


    <!-- Decorative circles -->

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
    <div class="circle four"></div>


    <!-- =========================
         LOGIN CARD
    ========================= -->

    <div class="login-box">


        <!-- Logo -->

        <div class="logo-icon">
            🪖
        </div>


        <!-- Brand -->

        <div class="brand-name">
            🇮🇳 DHRUB DEFENCE PORTAL
        </div>


        <!-- Title -->

        <h1>
            Dhrub Defence Career Finder
        </h1>


        <p class="subtitle">
            Login to continue your defence career journey
        </p>


        <!-- Security badge -->

        <div class="portal-badge">
            🔐 Secure Defence Career Portal
        </div>


        <!-- =========================
             LOGIN FORM
        ========================= -->

        <form action="/login" method="POST">


            <!-- Username -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper password-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        onclick="togglePasswordVisibility()">

                        Show

                    </button>

                </div>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-button">

                Login &nbsp; →
                
            </button>


        </form>


        <!-- Forgot Password -->

        <div class="forgot">

            <a href="/forgot-password">
                Forgot Password?
            </a>

        </div>


        <!-- Divider -->

        <div class="divider">

            <span>OR</span>

        </div>


        <!-- Signup -->

        <p class="signup-text">

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>

        </p>


        <!-- Security -->

        <p class="security-text">

            🔒 Your account information is protected

        </p>


        <div class="footer-text">

            BUILD YOUR FUTURE • SERVE THE NATION 🇮🇳

        </div>


    </div>


    <!-- =========================
         PASSWORD TOGGLE
    ========================= -->

    <script>

        function togglePasswordVisibility() {

            const password =
                document.getElementById("password");

            const toggleButton =
                document.getElementById("togglePassword");


            if (password.type === "password") {

                password.type = "text";

                toggleButton.textContent = "Hide";

            } else {

                password.type = "password";

                toggleButton.textContent = "Show";

            }

        }

    </script>


</body>

</html>
